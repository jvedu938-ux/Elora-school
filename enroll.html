<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admission Form | Elora International School</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
  scroll-behavior:smooth;
}

body{
  background:#387bd3;
  color:#333;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:100px;
  padding-bottom:50px;
}

/* ================= HEADER ================= */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:18px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(13,59,102,0.95);
  backdrop-filter:blur(10px);
  z-index:1000;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#fff;
  text-decoration:none;
}

.logo span{
  color:#ffb703;
}

nav a{
  text-decoration:none;
  color:#fff;
  margin-left:28px;
  transition:.3s;
  font-weight:500;
}

nav a:hover{
  color:#ffb703;
}

/* ================= FORM ================= */

.container{
  width:100%;
  max-width:650px;
  background:#ffffff;
  padding:40px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  margin:20px;
}

.form-header{
  text-align:center;
  margin-bottom:30px;
}

.form-header h2{
  color:#0d3b66;
  font-size:32px;
  margin-bottom:8px;
}

.form-header p{
  color:#666;
  font-size:15px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:600;
  color:#0d3b66;
  margin-bottom:6px;
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  padding:12px 16px;
  border:1.5px solid #e1e8f0;
  border-radius:10px;
  font-size:15px;
  color:#333;
  background:#f9fbfd;
  transition:all 0.3s ease;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#ffb703;
  background:#fff;
  box-shadow:0 0 0 4px rgba(255,183,3,0.15);
}

textarea{
  resize:vertical;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

/* ================= BUTTON ================= */

.btn-submit{
  display:block;
  width:100%;
  padding:16px;
  background:#ffb703;
  color:#000;
  font-size:16px;
  font-weight:bold;
  text-align:center;
  border:none;
  border-radius:40px;
  cursor:pointer;
  transition:.4s;
  margin-top:10px;
  box-shadow:0 4px 15px rgba(255,183,3,0.3);
}

.btn-submit:hover{
  transform:translateY(-3px);
  background:#0d3b66;
  color:#fff;
}

/* ================= MESSAGE ================= */

#message{
  display:none;
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  text-align:center;
  font-weight:600;
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){

  .container{
    padding:25px;
  }

  .form-row{
    grid-template-columns:1fr;
  }

  header{
    padding:15px 20px;
  }

  nav a{
    margin-left:10px;
    font-size:13px;
  }

}

</style>

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <a href="index.html" class="logo">
    Elora <span>School</span>
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </nav>

</header>


<!-- ================= ADMISSION FORM ================= -->

<div class="container">

  <div class="form-header">

    <h2>Online Admission Form</h2>

    <p>
      Academic Year 2026 - 2027
    </p>

  </div>


  <form id="admissionForm">

    <!-- Student Name -->

    <div class="form-group">

      <label for="studentName">
        Student Full Name *
      </label>

      <input
        type="text"
        id="studentName"
        placeholder="Enter student's full name"
        required>

    </div>


    <!-- Parents -->

    <div class="form-row">

      <div class="form-group">

        <label for="fatherName">
          Father's Name *
        </label>

        <input
          type="text"
          id="fatherName"
          placeholder="Father's full name"
          required>

      </div>


      <div class="form-group">

        <label for="motherName">
          Mother's Name *
        </label>

        <input
          type="text"
          id="motherName"
          placeholder="Mother's full name"
          required>

      </div>

    </div>


    <!-- DOB / Gender -->

    <div class="form-row">

      <div class="form-group">

        <label for="dob">
          Date of Birth *
        </label>

        <input
          type="date"
          id="dob"
          required>

      </div>


      <div class="form-group">

        <label for="gender">
          Gender *
        </label>

        <select id="gender" required>

          <option value="">
            Select Gender
          </option>

          <option>Male</option>
          <option>Female</option>
          <option>Other</option>

        </select>

      </div>

    </div>


    <!-- Class / Stream -->

    <div class="form-row">

      <div class="form-group">

        <label for="class">
          Applying for Class *
        </label>

        <select id="class" required>

          <option value="">
            Select Class
          </option>

          <option>Nursery</option>
          <option>LKG</option>
          <option>UKG</option>
          <option>Class 1</option>
          <option>Class 2</option>
          <option>Class 3</option>
          <option>Class 4</option>
          <option>Class 5</option>
          <option>Class 6</option>
          <option>Class 7</option>
          <option>Class 8</option>
          <option>Class 9</option>
          <option>Class 10</option>
          <option>Class 11</option>
          <option>Class 12</option>

        </select>

      </div>


      <div class="form-group">

        <label for="course">
          Preferred Stream / Subject
        </label>

        <select id="course">

          <option value="">
            Select Stream/Subject
          </option>

          <option>Science</option>
          <option>Commerce</option>
          <option>Arts</option>
          <option>Computer Application</option>
          <option>Information Technology</option>
          <option>Mathematics</option>
          <option>Biology</option>

        </select>

      </div>

    </div>


    <!-- Phone / Email -->

    <div class="form-row">

      <div class="form-group">

        <label for="phone">
          Mobile Number *
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="+91 98765 43210"
          required>

      </div>


      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="example@email.com">

      </div>

    </div>


    <!-- Address -->

    <div class="form-group">

      <label for="address">
        Residential Address *
      </label>

      <textarea
        id="address"
        rows="3"
        placeholder="Enter complete home address"
        required></textarea>

    </div>


    <!-- Submit -->

    <button
      type="submit"
      class="btn-submit"
      id="submitBtn">

      Submit Application

    </button>


    <!-- JS Message -->

    <div id="message"></div>

  </form>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

/* =========================================
   GET ELEMENTS
========================================= */

const form = document.getElementById("admissionForm");

const submitBtn = document.getElementById("submitBtn");

const message = document.getElementById("message");

const phone = document.getElementById("phone");

const dob = document.getElementById("dob");


/* =========================================
   SET MAX DOB
   Future DOB is not allowed
========================================= */

const today = new Date();

const year = today.getFullYear();

const month =
  String(today.getMonth() + 1).padStart(2, "0");

const day =
  String(today.getDate()).padStart(2, "0");

dob.max = `${year}-${month}-${day}`;


/* =========================================
   PHONE NUMBER VALIDATION
========================================= */

phone.addEventListener("input", function(){

  phone.value =
    phone.value.replace(/[^0-9+ ]/g, "");

});


/* =========================================
   FORM SUBMIT
========================================= */

form.addEventListener("submit", function(event){

  /* Stop page refresh */

  event.preventDefault();


  /* Get values */

  const studentName =
    document.getElementById("studentName").value.trim();

  const fatherName =
    document.getElementById("fatherName").value.trim();

  const motherName =
    document.getElementById("motherName").value.trim();

  const gender =
    document.getElementById("gender").value;

  const className =
    document.getElementById("class").value;

  const phoneNumber =
    phone.value.trim();

  const email =
    document.getElementById("email").value.trim();

  const address =
    document.getElementById("address").value.trim();


  /* =========================================
     NAME VALIDATION
  ========================================= */

  const namePattern = /^[A-Za-z ]+$/;


  if(!namePattern.test(studentName)){

    showMessage(
      "Please enter a valid student name.",
      "error"
    );

    return;

  }


  if(!namePattern.test(fatherName)){

    showMessage(
      "Please enter a valid father's name.",
      "error"
    );

    return;

  }


  if(!namePattern.test(motherName)){

    showMessage(
      "Please enter a valid mother's name.",
      "error"
    );

    return;

  }


  /* =========================================
     PHONE VALIDATION
  ========================================= */

  const cleanPhone =
    phoneNumber.replace(/\D/g, "");


  if(cleanPhone.length !== 10){

    showMessage(
      "Please enter a valid 10-digit mobile number.",
      "error"
    );

    return;

  }


  /* =========================================
     EMAIL VALIDATION
  ========================================= */

  if(email !== ""){

    const emailPattern =
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(!emailPattern.test(email)){

      showMessage(
        "Please enter a valid email address.",
        "error"
      );

      return;

    }

  }


  /* =========================================
     ADDRESS VALIDATION
  ========================================= */

  if(address.length < 10){

    showMessage(
      "Please enter a complete residential address.",
      "error"
    );

    return;

  }


  /* =========================================
     BUTTON LOADING
  ========================================= */

  submitBtn.innerText =
    "Submitting...";

  submitBtn.disabled = true;


  /* =========================================
     SUCCESS
  ========================================= */

  setTimeout(function(){

    showMessage(
      "🎉 Application submitted successfully! Thank you for applying to Elora International School.",
      "success"
    );


    submitBtn.innerText =
      "Application Submitted ✓";


    /* Reset form */

    form.reset();


  }, 1500);


});


/* =========================================
   SHOW MESSAGE FUNCTION
========================================= */

function showMessage(text, type){

  message.style.display = "block";

  message.innerText = text;


  if(type === "success"){

    message.style.background =
      "#d4edda";

    message.style.color =
      "#155724";

    message.style.border =
      "1px solid #c3e6cb";

  }

  else{

    message.style.background =
      "#f8d7da";

    message.style.color =
      "#721c24";

    message.style.border =
      "1px solid #f5c6cb";

  }


  /* Hide message after 5 seconds */

  setTimeout(function(){

    message.style.display = "none";

  }, 5000);

}

</script>

</body>

</html>
